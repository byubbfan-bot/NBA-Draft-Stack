<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NBA Strategy & Cap Simulation</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #121212;
            color: #fff;
            padding: 20px;
        }
        .container {
            max-width: 950px;
            margin: 0 auto;
            background: #1e1e1e;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h1, h2 {
            color: #ff9800;
            text-align: center;
            margin-bottom: 5px;
        }
        .subtitle {
            text-align: center;
            color: #aaa;
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 0.95em;
        }
        .hud-bar {
            display: flex;
            justify-content: space-around;
            background: #151515;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #333;
        }
        .hud-item {
            text-align: center;
            font-size: 1.1em;
        }
        .hud-item span {
            display: block;
            font-weight: bold;
            font-size: 1.3em;
            color: #ff9800;
        }
        .hud-item span.bankrupt {
            color: #f44336;
        }
        .lineup-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            margin: 15px 0;
        }
        .card {
            background: #2a2a2a;
            border: 2px solid #444;
            border-radius: 8px;
            padding: 12px;
            text-align: center;
            transition: 0.2s;
            position: relative;
            min-height: 140px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
        }
        .card.active {
            border-color: #ff9800;
            cursor: pointer;
        }
        .card.active:hover:not(.disabled) {
            background: #333;
            transform: translateY(-3px);
            box-shadow: 0 4px 10px rgba(255,152,0,0.2);
        }
        .card.disabled {
            opacity: 0.4;
            cursor: not-allowed;
            border-color: #333;
        }
        .pixel-portrait {
            display: grid;
            grid-template-columns: repeat(8, 5px);
            grid-template-rows: repeat(8, 5px);
            gap: 0;
            width: 40px;
            height: 40px;
            background: transparent;
            margin: 8px auto;
            image-rendering: pixelated;
        }
        .p-block {
            width: 5px;
            height: 5px;
        }
        .badge {
            display: inline-block;
            background: #ff9800;
            color: #000;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.75em;
            margin-top: 5px;
        }
        .badge.price {
            background: #4caf50;
            color: #fff;
            margin-top: 5px;
        }
        .pos-label {
            font-size: 0.8em;
            color: #888;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 4px;
        }
        .btn {
            display: block;
            width: 100%;
            max-width: 240px;
            margin: 25px auto;
            padding: 14px;
            background: #ff9800;
            border: none;
            color: #000;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1.1em;
            transition: 0.2s;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .btn:hover {
            background: #e08600;
            box-shadow: 0 4px 15px rgba(255,152,0,0.4);
        }
        .btn-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .draft-pool {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin: 20px 0;
        }
        .live-counter {
            font-size: 2em;
            font-weight: bold;
            color: #ff9800;
            margin: 15px 0;
            letter-spacing: 1px;
            line-height: 1.4;
        }
        .result-graphic {
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            margin: 25px 0;
            animation: scaleUp 0.4s ease-out;
            box-shadow: inset 0 0 40px rgba(0,0,0,0.6);
        }
        .result-graphic.win {
            background: linear-gradient(135deg, #1b4d3e, #0f2a1d);
            border: 4px solid #4caf50;
        }
        .result-graphic.loss {
            background: linear-gradient(135deg, #5c1d1d, #301010);
            border: 4px solid #f44336;
        }
        .graphic-title {
            font-size: 3.5em;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin: 0 0 10px 0;
            text-shadow: 2px 4px 10px rgba(0,0,0,0.7);
        }
        .win .graphic-title {
            color: #4caf50;
        }
        .loss .graphic-title {
            color: #f44336;
        }
        .graphic-banner {
            font-size: 1.3em;
            font-weight: 600;
            margin-bottom: 20px;
            color: #eee;
        }
        .graphic-stats {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin: 20px 0;
            font-size: 1.8em;
            font-weight: bold;
            background: rgba(0,0,0,0.3);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .stat-label {
            font-size: 0.5em;
            text-transform: uppercase;
            color: #aaa;
            display: block;
            margin-bottom: 4px;
        }
        @keyframes scaleUp {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🏀 NBA Strategy & Cap Simulation</h1>
    <p class="subtitle">Both managers operate with a strict $15.0M budget. Challenge the line-up below.</p>
    <div class="hud-bar">
        <div class="hud-item">Total Cash Budget <span id="hud-bank">$15.0M</span></div>
        <div class="hud-item">Current Draft Target <span id="hud-pos">PG</span></div>
    </div>
    <div id="opponent-section">
        <h2>Opponent Lineup</h2>
        <div id="opponent-lineup" class="lineup-grid"></div>
    </div>
    <div id="draft-section">
        <h2>Available Free Agent Catalog</h2>
        <p style="text-align:center; color:#aaa; font-size:0.9em;">Analyze market options carefully. No rerolls allowed this season.</p>
        <div id="draft-catalog" class="draft-pool"></div>
    </div>
    <div id="user-section" style="margin-top:30px;">
        <h2>Your Active Lineup</h2>
        <div id="user-lineup" class="lineup-grid"></div>
    </div>
    <div id="sim-section" style="display:none;">
        <button class="btn" id="sim-btn" onclick="startLiveSimulation()">▶ Start Simulation</button>
        <div id="sim-results" class="status-box" style="display:none;"></div>
    </div>
</div>
<script>
    function getPlayerCost(ovr) {
        if (ovr >= 97) return 5.0; 
        if (ovr >= 95) return 4.2; 
        if (ovr >= 92) return 3.2; 
        if (ovr >= 88) return 2.2; 
        return 1.2;                
    }

    function render8BitFaceHTML(name) {
        let seed = name.split('').reduce((acc, char) => acc + char.charCodeAt(0), 0);
        const skinColors = ["#dfa070", "#c68a5c", "#a0653d", "#eec590"];
        const hairColors = ["#000000", "#4a2306", "#9a3300", "#d8b020"];
        const jerseyColors = ["#1e3d59", "#ff6e40", "#17b978", "#ffc93c", "#e84a5f"];
        let skin = skinColors[seed % skinColors.length];
        let hair = hairColors[(seed >> 2) % hairColors.length];
        let team = jerseyColors[(seed >> 4) % jerseyColors.length];
        let background = "rgba(0,0,0,0.2)";
        let matrix = [, , , , , , , ];
        let html = '<div class="pixel-portrait">';
        for(let r=0; r<8; r++) {
            for(let c=0; c<8; c++) {
                let code = matrix[r] ? matrix[r][c] : 0;
                let color = background;
                if(code === 1) color = hair;
                if(code === 2) color = skin;
                if(code === 4) color = team;
                html += `<div class="p-block" style="background:${color}"></div>`;
            }
        }
        html += '</div>';
        return html;
    }

    const playersDB = {
        PG: [
            { name: "Magic Johnson", ovr: 98 },
            { name: "Stephen Curry", ovr: 96 },
            { name: "Luka Doncic", ovr: 97 },
            { name: "Allen Iverson", ovr: 93 },
            { name: "Steve Nash", ovr: 92 },
            { name: "Shai G.-Alexander", ovr: 95 },
            { name: "Kyrie Irving", ovr: 90 },
            { name: "Chris Paul", ovr: 89 },
            { name: "Jalen Brunson", ovr: 91 },
            { name: "Ja Morant", ovr: 90 },
            { name: "Russell Westbrook", ovr: 88 },
            { name: "John Stockton", ovr: 92 },
            { name: "Jason Kidd", ovr: 90 },
            { name: "Derrick Rose", ovr: 89 },
            { name: "Tyrese Haliburton", ovr: 90 },
            { name: "De'Aaron Fox", ovr: 89 },
            { name: "Damian Lillard", ovr: 88 },
            { name: "Trae Young", ovr: 87 },
            { name: "LaMelo Ball", ovr: 86 },
            { name: "Cade Cunningham", ovr: 86 }
        ],
        SG: [
            { name: "Michael Jordan", ovr: 99 },
            { name: "Kobe Bryant", ovr: 98 },
            { name: "Dwyane Wade", ovr: 94 },
            { name: "Anthony Edwards", ovr: 93 },
            { name: "Devin Booker", ovr: 92 },
            { name: "James Harden", ovr: 91 },
            { name: "Ray Allen", ovr: 89 },
            { name: "Donovan Mitchell", ovr: 91 },
            { name: "Jaylen Brown", ovr: 90 },
            { name: "Klay Thompson", ovr: 86 },
            { name: "Reggie Miller", ovr: 90 },
            { name: "Manu Ginobili", ovr: 88 },
            { name: "Vince Carter", ovr: 91 },
            { name: "Tracy McGrady", ovr: 93 },
            { name: "Tyrese Maxey", ovr: 89 },
            { name: "Desmond Bane", ovr: 86 },
            { name: "Austin Reaves", ovr: 84 },
            { name: "Tyler Herro", ovr: 85 },
            { name: "Malik Monk", ovr: 83 },
            { name: "CJ McCollum", ovr: 84 }
        ],
        SF: [
            { name: "LeBron James", ovr: 98 },
            { name: "Larry Bird", ovr: 97 },
            { name: "Kevin Durant", ovr: 95 },
            { name: "Jayson Tatum", ovr: 94 },
            { name: "Kawhi Leonard", ovr: 92 },
            { name: "Carmelo Anthony", ovr: 90 },
            { name: "Jimmy Butler", ovr: 89 },
            { name: "Scottie Pippen", ovr: 91 },
            { name: "Paul George", ovr: 88 },
            { name: "Brandon Ingram", ovr: 86 },
            { name: "Julius Erving", ovr: 94 },
            { name: "Dominique Wilkins", ovr: 91 },
            { name: "Paul Pierce", ovr: 89 },
            { name: "Lauri Markkanen", ovr: 88 },
            { name: "Mikal Bridges", ovr: 85 },
            { name: "OG Anunoby", ovr: 85 },
            { name: "Franz Wagner", ovr: 86 },
            { name: "Demar DeRozan", ovr: 86 },
            { name: "Michael Porter Jr.", ovr: 84 },
            { name: "Khris Middleton", ovr: 84 }
        ],
        PF: [
            { name: "Charles Barkley", ovr: 93 },
            { name: "Zion Williamson", ovr: 88 },
            { name: "Anthony Davis", ovr: 94 },
            { name: "Paolo Banchero", ovr: 89 },
            { name: "Domantas Sabonis", ovr: 88 },
            { name: "Karl-Anthony Towns", ovr: 87 },
            { name: "Dennis Rodman", ovr: 88 },
            { name: "Chris Bosh", ovr: 88 },
            { name: "Pau Gasol", ovr: 89 },
            { name: "Amare Stoudemire", ovr: 87 },
            { name: "Jaren Jackson Jr.", ovr: 87 },
            { name: "Pascal Siakam", ovr: 88 },
            { name: "Evan Mobley", ovr: 86 },
            { name: "Aaron Gordon", ovr: 84 },
            { name: "Julius Randle", ovr: 85 },
            { name: "Kyle Kuzma", ovr: 83 },
            { name: "Tim Duncan", ovr: 97 },
            { name: "Giannis Antetokounmpo", ovr: 96 },
            { name: "Kevin Garnett", ovr: 95 },
            { name: "Dirk Nowitzki", ovr: 94 }
        ],
        C: [
            { name: "Shaquille O'Neal", ovr: 98 },
            { name: "Nikola Jokic", ovr: 98 },
            { name: "Kareem Abdul-Jabbar", ovr: 99 },
            { name: "Hakeem Olajuwon", ovr: 97 },
            { name: "Joel Embiid", ovr: 96 },
            { name: "Victor Wembanyama", ovr: 94 },
            { name: "Wilt Chamberlain", ovr: 97 },
            { name: "Bam Adebayo", ovr: 89 },
            { name: "Rudy Gobert", ovr: 85 },
            { name: "Chet Holmgren", ovr: 88 },
            { name: "Bill Russell", ovr: 96 },
            { name: "David Robinson", ovr: 95 },
            { name: "Patrick Ewing", ovr: 93 },
            { name: "Alonzo Mourning", ovr: 90 },
            { name: "Kristaps Porzingis", ovr: 87 },
            { name: "Jarrett Allen", ovr: 85 },
            { name: "Myles Turner", ovr: 84 },
            { name: "Brook Lopez", ovr: 82 },
            { name: "Jonas Valanciunas", ovr: 82 }
        ]
    };

    Object.keys(playersDB).forEach(pos => {
        playersDB[pos].forEach(p => p.cost = getPlayerCost(p.ovr));
    });

    const positions = ["PG", "SG", "SF", "PF", "C"];
    let currentPositionIndex = 0;
    let cashBank = 15.0;
    let userTeam = { PG: null, SG: null, SF: null, PF: null, C: null };
    let opponentTeam = { PG: null, SG: null, SF: null, PF: null, C: null };

    function initGame() {
        positions.forEach(pos => {
            let options = [...playersDB[pos]].sort(() => 0.5 - Math.random());
            opponentTeam[pos] = options.find(p => p.cost <= 3.2) || options[options.length-1];
        });
        let totalOpponentCost = positions.reduce((sum, pos) => sum + opponentTeam[pos].cost, 0);
        document.getElementById('opponent-section').querySelector('h2').innerText = `Opponent Lineup (Total Cost: $${totalOpponentCost.toFixed(1)}M)`;
        renderOpponentLineup();
        renderUserLineup();
        generateDraftCatalog();
    }

    function resetToNewCampaign() {
        currentPositionIndex = 0;
        cashBank = 15.0;
        userTeam = { PG: null, SG: null, SF: null, PF: null, C: null };
        opponentTeam = { PG: null, SG: null, SF: null, PF: null, C: null };
        document.getElementById('sim-section').style.display = 'none';
        document.getElementById('sim-section').innerHTML = `<button class="btn" id="sim-btn" onclick="startLiveSimulation()">▶ Start Simulation</button><div id="sim-results" class="status-box" style="display:none;"></div>`;
        document.getElementById('draft-section').style.display = 'block';
        initGame();
    }

    function retrySameMatch() {
        currentPositionIndex = 0;
        cashBank = 15.0;
        userTeam = { PG: null, SG: null, SF: null, PF: null, C: null };
        document.getElementById('sim-section').style.display = 'none';
        document.getElementById('sim-section').innerHTML = `<button class="btn" id="sim-btn" onclick="startLiveSimulation()">▶ Start Simulation</button><div id="sim-results" class="status-box" style="display:none;"></div>`;
        document.getElementById('draft-section').style.display = 'block';
        renderUserLineup();
        generateDraftCatalog();
    }

    function renderOpponentLineup() {
        const oppDiv = document.getElementById('opponent-lineup');
        oppDiv.innerHTML = positions.map(pos => {
            const p = opponentTeam[pos];
            return `
                <div class="card">
                    <div class="pos-label">${pos}</div>
                    ${render8BitFaceHTML(p.name)}
                    <strong>${p.name}</strong>
                    <span class="badge price">-$${p.cost.toFixed(1)}M</span>
                </div>
            `;
        }).join('');
    }

    function renderUserLineup() {
        const userDiv = document.getElementById('user-lineup');
        userDiv.innerHTML = positions.map(pos => {
            const p = userTeam[pos];
            return `
                <div class="card" style="${!p ? 'border-style: dashed; background: transparent;' : ''}">
                    <div class="pos-label">${pos}</div>
                    ${p ? render8BitFaceHTML(p.name) : '<div style="height:40px; margin:8px 0; display:flex; align-items:center; color:#444;">?</div>'}
                    <strong>${p ? p.name : 'Empty'}</strong>
                    ${p ? `<span class="badge price">-$${p.cost.toFixed(1)}M</span>` : ''}
                </div>
            `;
        }).join('');
        const bankEl = document.getElementById('hud-bank');
        bankEl.innerText = `$${cashBank.toFixed(1)}M`;
        if (cashBank <= 1.5) bankEl.className = 'bankrupt';
    }

    function generateDraftCatalog() {
        if (currentPositionIndex >= positions.length) {
            document.getElementById('draft-section').style.display = 'none';
            document.getElementById('sim-section').style.display = 'block';
            return;
        }
        const currentPos = positions[currentPositionIndex];
        document.getElementById('hud-pos').innerText = currentPos;
        let rawChoices = playersDB[currentPos].filter(p => p.name !== opponentTeam[currentPos].name).sort(() => 0.5 - Math.random());
        let affordable = rawChoices.filter(p => p.cost <= cashBank);
        if (affordable.length === 0) {
            let cheapest = [...playersDB[currentPos]].filter(p => p.name !== opponentTeam[currentPos].name).sort((a,b) => a.cost - b.cost);
            rawChoices = [cheapest, ...rawChoices.filter(x => x.name !== cheapest.name).slice(0,3)];
        } else {
            rawChoices = rawChoices.slice(0, 4);
        }
        const catalogDiv = document.getElementById('draft-catalog');
        catalogDiv.innerHTML = rawChoices.map(p => {
            const dynamicLocked = p.cost > cashBank;
            return `
                <div class="card active ${dynamicLocked ? 'disabled' : ''}" 
                     onclick="${dynamicLocked ? '' : `pickPlayer('${currentPos}', '${p.name}', ${p.ovr}, ${p.cost})`}">
                    ${render8BitFaceHTML(p.name)}
                    <strong>${p.name}</strong>
                    <span class="badge price">$${p.cost.toFixed(1)}M</span>
                </div>
            `;
        }).join('');
    }

    function pickPlayer(pos, name, ovr, cost) {
        userTeam[pos] = { name, ovr, cost };
        cashBank -= cost;
        renderUserLineup();
        currentPositionIndex++;
        generateDraftCatalog();
    }

    function startLiveSimulation() {
        const container = document.getElementById('sim-section');
        container.innerHTML = `<button class="btn" id="sim-btn" style="display:none;">▶ Start Simulation</button><div id="sim-results" class="status-box"></div>`;
        const resultsDiv = document.getElementById('sim-results');
        const userOVR = positions.reduce((sum, pos) => sum + userTeam[pos].ovr, 0) / 5;
        const oppOVR = positions.reduce((sum, pos) => sum + opponentTeam[pos].ovr, 0) / 5;
        let currentGame = 0;
        let userWins = 0;
        let oppWins = 0;
        const totalGames = 82;
        const simInterval = setInterval(() => {
            currentGame++;
            let baselineChance = 0.50;
            if (userOVR > oppOVR) baselineChance = 0.62;
            if (userOVR < oppOVR - 1.5) baselineChance = 0.38;
            let userChance = Math.max(0.20, Math.min(0.80, baselineChance));
            if (Math.random() < userChance) userWins++;
            if (Math.random() < 0.50) oppWins++;
            resultsDiv.innerHTML = `
                <h3>🔄 Live Simulating Regular Season Outcomes...</h3>
                <div class="live-counter">
                    YOUR SQUAD: <span style="color:#4caf50;">${userWins} W</span> - <span style="color:#e57373;">${currentGame - userWins} L</span><br>
                    OPPONENT: <span style="color:#2196f3;">${oppWins} W</span> - <span style="color:#ffb74d;">${currentGame - oppWins} L</span>
                </div>
                <div style="color:#888; font-size: 0.9em;">Processing Match ${currentGame} of ${totalGames}</div>
            `;
