        .hud-item {

        .hud-item span {
            display: block;

            background: #333;
            transform: translateY(-3px);
            box-shadow: 0 4px 10px rgba(255,152,0,0.2);
        }
        .card.disabled {
            opacity: 0.4;
            cursor: not-allowed;
            border-color: #333;
        }
        .pixel-portrait {
            display: grid;
            grid-template-columns: repeat(8, 5px);
            grid-template-rows: repeat(8, 5px);
            gap: 0;
            width: 40px;
            height: 40px;
            background: transparent;
            margin: 8px auto;
            image-rendering: pixelated;
        }
        .p-block {
            width: 5px;

            color: #fff;
            margin-top: 5px;
        }
        .pos-label {

            color: #888;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

            padding: 14px;

            gap: 15px;
            margin: 20px 0;

            color: #ff9800;
            margin: 15px 0;
            letter-spacing: 1px;
            line-height: 1.4;
        }
        .result-graphic {
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            margin: 25px 0;
            animation: scaleUp 0.4s ease-out;
            box-shadow: inset 0 0 40px rgba(0,0,0,0.6);

        }

            font-weight: 600;
            margin-bottom: 20px;
            color: #eee;
        }
